<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>

        *, html{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: rgb(167, 196, 196);
            
        }
        ul{
            list-style: none;
            display: flex;
            justify-content: center;
            margin-top: 10px;
            background-color: rgb(53, 58, 58);
            padding: 10px 0px;
        }
        ul li{
            margin: 0px 10px;
        }
        ul li a{
            text-decoration: none;
            color: white;
            padding: 5px 6px;
            font-family:Arial, Helvetica, sans-serif;
            font-size: 12px;   
        }
        ul li a:hover{
            color:aqua;
            font-size: 13px;
            text-decoration: underline;
            text-shadow: 0px 1px 2px #710522;
        }
        #apply-now{
            background-color: rgb(241,91,32);
            border-radius: 5px;
            padding:5px 8px
        }
        #apply-now a{
            color: white;
            font-size: 12px;
        }
        #apply-now a:hover{
       
            font-size: 13px;
            text-decoration: none;
            text-shadow: 0px 1px 2px #710522;
            
        }
        .active{
            color: aqua;
            font-size: 13px;
            text-decoration: underline;
            text-shadow: 0px 1px 2px #710522;
        }
    </style>
</head>
<body>
    <ul>
        <li id="apply-now"><a href="https://www.kiet.edu/admissions/closed/" target="_blank">Apply Now</a></li>
        <li><a href="#" class="active">Home</a></li>
        <li><a href="list.html" target="_blank">About</a></li>
        <li><a href="layout/layout.html" target="_blank">Services</a></li>
        <li><a href="#">Contact</a></li>
        <li><a href="#">Blog</a></li>
        <li><a href="#">FAQ</a></li>
    </ul>
</body>
</html>
