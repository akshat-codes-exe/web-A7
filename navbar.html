<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
        ul li{
            display: inline-block;
            padding: 10px;
            background-color: lightblue;
            border: 4px solid white;
            font-size: 25px;
            font-weight: bold;
        }
        ul li a:hover{
            background-color: rgb(228, 17, 228);
            font-size: 30px;
        }
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Georgia, serif;
        }

        .container {
            width: 80%;
            margin: auto;
        }

        header {
            height: 120px;
            background-color: lightblue;
            border: 4px solid white;

            text-align: center;
            padding: 40px;

            font-size: 25px;
            font-weight: bold;
        }

        nav {
            height: 100px;
            background-color: lightblue;
            border: 4px solid white;

            text-align: center;
            padding: 30px;

            font-size: 25px;
            font-weight: bold;
        }

        main {
            height: 440px;
            display: flex;
        }

        aside {
            width: 30%;
            background-color: lightblue;
            border: 4px solid white;

            text-align: center;
            padding-top: 200px;

            font-size: 25px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="sachinTendulkar.html">Home</a></li>
            <li><a href="lists.html">Lists</a></li>
            <li><a href="layout1.html">Layout 1</a></li>
        </ul>
    </nav>
</body>
</html>
