<!DOCTYPE html>
<html>
<head>
    <title>Web Page Layout</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Georgia, serif;
        }

        .container {
            width: 80%;
            margin: auto;
        }

        header {
            height: 120px;
            background-color: lightblue;
            border: 4px solid white;

            text-align: center;
            padding: 40px;

            font-size: 25px;
            font-weight: bold;
        }

        nav {
            height: 100px;
            background-color: lightblue;
            border: 4px solid white;

            text-align: center;
            padding: 30px;

            font-size: 25px;
            font-weight: bold;
        }

        main {
            height: 440px;
            display: flex;
        }

        aside {
            width: 30%;
            background-color: lightblue;
            border: 4px solid white;

            text-align: center;
            padding-top: 200px;

            font-size: 25px;
            font-weight: bold;
        }

        article {
            width: 70%;
            background-color: lightblue;
            border: 4px solid white;

            text-align: center;
            padding-top: 200px;

            font-size: 25px;
            font-weight: bold;
        }

        footer {
            height: 120px;
            background-color: lightblue;
            border: 4px solid white;

            text-align: center;
            padding: 40px;

            font-size: 25px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            Header
        </header>

        <nav>
            Navbar
        </nav>

        <main>

            <aside>
                Aside
            </aside>

            <article>
                Article
            </article>

        </main>

        <footer>
            Footer
        </footer>

    </div>

</body>
</html>
